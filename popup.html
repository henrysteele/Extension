<!DOCTYPE html>
<html>

<head>
  <title>Video Workout Timer Settings</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }

    label {
      display: inline;
      margin-bottom: 5px;
    }

    input[type="number"] {
      width: fit-content
    }

    button {
      padding: 5px 10px;
      margin-top: 10px;
    }
  </style>
</head>

<body style="width:200px">
  <img src="./stopwatchheart.png" alt="Stopwatch Heart" width="20">
  <h1>Video Workout Timer Settings</h1>

  <div>
    <input type="checkbox" id="enabled" checked> <label for="enabled">enabled</label>
  </div>
  <div>
    <label for="maxTime">Max Time:</label>
    <input type="number" id="maxTime" min="1" value="60">
  </div>
  <div>
    <label for="transitionTime">Transition Time:</label>
    <input type="number" id="transitionTime" min="1" value="10">
  </div>


  <button id="saveButton">Save</button>

  <script src="popup.js"></script>
</body>

</html>
